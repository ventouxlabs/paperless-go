MaintainerNotes: |-
  Flutter app with ABI splits. Version code scheme:
  baseVersionCode * 10 + abiCode, where
  abiCodes: armeabi-v7a=1, arm64-v8a=2, x86_64=3.

  This build is deliberately not the GitHub release build. prebuild strips
  google_mlkit_text_recognition and cunning_document_scanner and swaps in the
  pure-Dart stubs, so the F-Droid APK has no Google ML Kit: document deskew
  falls back to the Dart implementation and OCR metadata suggestions are absent.

  applicationId is com.ventouxlabs.paperlessgo. The earlier id
  com.ventoux.paperlessgo (which this file used to be named for) was burned on
  Play and is not what the build produces - metadata filed under it would never
  match the built APK.

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
  - '%c * 10 + 3'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.2.1
