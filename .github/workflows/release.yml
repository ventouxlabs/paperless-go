name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../keystore.jks
          EOF
          sed -i 's/^ *//' android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --obfuscate --split-debug-info=./debug-info/

      - name: Build release AAB
        run: flutter build appbundle --release --obfuscate --split-debug-info=./debug-info-aab/

      # A release APK signed with the wrong key cannot be fixed after the fact:
      # anyone who installs it can only move to a correctly signed build by
      # uninstalling, which destroys their server config, credentials and any
      # queued uploads. One debug-signed build already reached a real phone.
      # Fail the publish instead of shipping it.
      - name: Verify the release APK carries the release key
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=""
          if [ -n "$SDK" ]; then
            APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          fi
          [ -z "$APKSIGNER" ] && APKSIGNER=$(command -v apksigner || true)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found; cannot verify the release signature."
            exit 1
          fi
          echo "apksigner: $APKSIGNER"

          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -l "$APK"

          # Captured and echoed rather than piped straight into a parser: the
          # first version of this step swallowed apksigner's output, so when the
          # match failed it reported an empty fingerprint and gave no way to see
          # why. Certificate details are public, so printing them costs nothing.
          RAW=$("$APKSIGNER" verify --print-certs "$APK" 2>&1)
          RC=$?
          echo "----- apksigner output -----"
          echo "$RAW"
          echo "---------------------------"
          if [ "$RC" -ne 0 ]; then
            echo "::error::apksigner could not verify $APK (exit $RC)."
            exit 1
          fi

          # Matched on the digest itself, not on a label. Different build-tools
          # versions word the line differently (a signer block can be prefixed
          # with an sdk range), and the 64-hex digest is the stable part.
          EXPECTED=a25ed068ab331c292cccb58b791d9ab65b9711549542bcc88b63087bddd58e81
          ACTUAL=$(printf '%s\n' "$RAW" \
            | grep -i "certificate SHA-256 digest" \
            | head -1 \
            | grep -oiE '[0-9a-f]{64}' \
            | tr 'A-Z' 'a-z')

          echo "expected: $EXPECTED"
          echo "actual:   ${ACTUAL:-<none found>}"
          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read a SHA-256 certificate digest from apksigner output (see above)."
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Release APK is not signed with the Paperless Go release key - refusing to publish."
            exit 1
          fi
          echo "Signature verified."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true

  # F-Droid builds from the GitLab mirror, not from GitHub, and finds releases
  # by scanning that remote for tags (UpdateCheckMode: Tags). Twice now the
  # mirror has fallen dozens of commits and several tags behind - v1.1.5 and
  # again at v1.2.1 - and both times F-Droid users sat on an old build for
  # months because a tag F-Droid could see simply did not exist. Pushing the tag
  # from the same workflow that publishes it is the only way the two channels
  # cannot drift.
  #
  # Runs only after the signature gate above has passed: a tag F-Droid can see
  # should be a tag we were willing to publish.
  mirror-tag-to-gitlab:
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The mirror push needs real history; the default depth-1 checkout
          # cannot fast-forward GitLab's main.
          fetch-depth: 0

      - name: Push tag and main to the GitLab mirror
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_MIRROR_TOKEN:-}" ]; then
            echo "::error::GITLAB_MIRROR_TOKEN is not set. F-Droid reads tags from the GitLab mirror, so without it this tag is invisible to F-Droid and someone must push it by hand."
            exit 1
          fi
          REMOTE="https://oauth2:${GITLAB_MIRROR_TOKEN}@gitlab.com/selector4560/paperless-go.git"
          TAG="${GITHUB_REF_NAME}"
          echo "Mirroring ${TAG} and main to gitlab.com/selector4560/paperless-go"
          # Both are fast-forward only: this must never rewrite the mirror.
          git push "$REMOTE" "HEAD:refs/heads/main"
          git push "$REMOTE" "refs/tags/${TAG}"
          echo "Mirrored ${TAG}."
