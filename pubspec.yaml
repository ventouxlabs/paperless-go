name: paperless_go
description: A modern Paperless-ngx client
publish_to: 'none'
version: 1.2.2+17

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Navigation
  go_router: ^14.0.0

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # UI
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_markdown: ^0.7.4
  shimmer: ^3.0.0

  # PDF Viewing
  pdfx: ^2.8.0

  # Sharing & Files
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  path_provider: ^2.1.5

  # Scanner & File Picking
  cunning_document_scanner: ^1.4.0
  file_picker: ^8.1.7
  image: ^4.3.0

  # Biometric Auth
  local_auth: ^2.3.0

  # Local Notifications
  flutter_local_notifications: ^18.0.1

  # Connectivity
  connectivity_plus: ^6.1.1

  # Database (Drift/SQLite)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path: ^1.9.0

  # PDF Generation
  pdf: ^3.11.1

  # Home Screen Widget
  home_widget: ^0.7.0

  # Package Info
  package_info_plus: ^8.0.0

  # Utilities
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  intl: ^0.19.0
  google_mlkit_text_recognition: ^0.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  http_mock_adapter: ^0.6.1
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon-1024.png"
  adaptive_icon_background: "#17A262"
  adaptive_icon_foreground: "assets/icon/icon-1024.png"

flutter:
  uses-material-design: true

  # Inter and Space Grotesk bundled as variable fonts (one file each, all
  # weights) so the app never fetches fonts from Google's CDN at runtime —
  # a hard F-Droid requirement. See core/theme.dart.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
